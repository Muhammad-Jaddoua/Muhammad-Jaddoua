<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="t d">
  <title id="t">Muhammad Jaddoua, Backend and AI Engineer</title>
  <desc id="d">Banner with the name Muhammad Jaddoua, the title Backend and AI Engineer, and a network of connected nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#15233f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="18" fill="url(#glow)"/>

  <!-- network motif -->
  <g stroke="url(#accent)" stroke-opacity="0.45" stroke-width="1.6" fill="none">
    <path d="M760 70 L860 130 L970 80 L1080 150"/>
    <path d="M860 130 L900 220 L1010 200 L1080 150"/>
    <path d="M970 80 L1010 200"/>
    <path d="M760 70 L820 190 L900 220"/>
    <path d="M1080 150 L1140 90"/>
  </g>
  <g fill="#0b1220" stroke="url(#accent)" stroke-width="2.5">
    <circle cx="760" cy="70" r="8"/>
    <circle cx="860" cy="130" r="12"/>
    <circle cx="970" cy="80" r="9"/>
    <circle cx="1080" cy="150" r="13"/>
    <circle cx="900" cy="220" r="9"/>
    <circle cx="1010" cy="200" r="8"/>
    <circle cx="820" cy="190" r="6"/>
    <circle cx="1140" cy="90" r="6"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="860" cy="130" r="4.5"/>
    <circle cx="1080" cy="150" r="5"/>
    <circle cx="970" cy="80" r="3.5"/>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="64" y="128" font-size="58" font-weight="700" fill="#f8fafc">Muhammad Jaddoua</text>
    <rect x="66" y="148" width="96" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="64" y="200" font-size="30" font-weight="500" fill="#e2e8f0">Backend &amp; AI Engineer</text>
    <text x="64" y="238" font-size="18" fill="#94a3b8">Microservices  ·  Event-driven systems  ·  Applied ML</text>
  </g>
</svg>
